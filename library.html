<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Library - Sketchbook Trilogies</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <style>
    :root {
      --ink: #05070b;
      --paper: #bfc7dc;
      --panel: #8a91a1;
      --tile: #8a91a1;
      --muted: #3f4654;
      --line: #090a0d;
      --link: #002fff;
      --visited: #4f1eb7;
      --bevel-light: #c8cedd;
      --bevel-dark: #4c5363;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 1px 1px, #2a2a33 1px, transparent 1.5px) 0 0 / 7px 7px,
        #06060a;
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
    }

    a {
      color: var(--link);
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 1px;
    }

    a:visited {
      color: var(--visited);
    }

    .page {
      width: min(100vw - 18px, 720px);
      min-height: 100vh;
      margin: 0 auto;
      background:
        repeating-linear-gradient(0deg, rgba(255, 255, 255, .06) 0 1px, transparent 1px 4px),
        var(--paper);
      border-left: 4px solid #51596b;
      border-right: 4px solid #51596b;
      box-shadow: 0 0 0 1px #171a22;
      padding: 0 22px 32px;
    }

    .topbar {
      min-height: 42px;
      display: flex;
      align-items: start;
      gap: 6px;
      border-bottom: 3px double #6c758b;
      overflow: hidden;
    }

    .brand {
      width: 215px;
      height: 34px;
      object-fit: contain;
      object-position: left center;
      filter: contrast(1.18);
      margin-top: 2px;
    }

    .nav {
      display: flex;
      align-items: start;
      gap: 4px;
      min-height: 34px;
      padding-top: 3px;
      font-size: 16px;
      line-height: 1.15;
      white-space: nowrap;
      flex-wrap: wrap;
    }

    .nav p,
    p {
      margin: 0;
    }

    h1 {
      margin: 14px 0 0;
      font-size: 26px;
      line-height: 1.05;
      text-transform: uppercase;
      text-shadow: 1px 1px 0 #e2e6f2;
    }

    .subtitle {
      margin-top: 4px;
      padding-bottom: 12px;
      font-size: 14px;
      font-weight: 700;
      border-bottom: 4px solid var(--line);
    }

    .state-box {
      margin-top: 14px;
      border: 4px solid #5f687d;
      background: #a2aabc;
      color: #1d2330;
      padding: 14px;
      font-size: 14px;
      line-height: 1.3;
    }

    .panel {
      margin-top: 14px;
      border: 4px solid #5f687d;
      background: var(--panel);
      box-shadow:
        inset 2px 2px 0 var(--bevel-light),
        inset -2px -2px 0 var(--bevel-dark);
      padding: 22px 14px;
      text-align: center;
      font-size: 14px;
      color: #23283a;
    }

    .panel[hidden] {
      display: none;
    }

    .panel b {
      display: block;
      font-size: 17px;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .shelf {
      margin-top: 22px;
    }

    .shelf h2 {
      margin: 0 0 8px;
      font-size: 18px;
      text-transform: uppercase;
      border-bottom: 3px double #6c758b;
      padding-bottom: 4px;
    }

    .comics-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px 16px;
    }

    .empty-state {
      grid-column: 1 / -1;
      min-height: 0;
      padding: 12px;
      border: 3px solid #5f687d;
      background: #a2aabc;
      color: #1d2330;
      font: 13px/1.25 Georgia, "Times New Roman", serif;
    }

    .comic-card,
    .comic-card:visited {
      min-width: 0;
      background: var(--tile);
      border: 4px solid #5f687d;
      color: #111;
      text-decoration: none;
      display: grid;
      grid-template-rows: auto auto;
      overflow: hidden;
      cursor: pointer;
      box-shadow:
        inset 2px 2px 0 var(--bevel-light),
        inset -2px -2px 0 var(--bevel-dark);
      transition: transform .08s steps(2, end), box-shadow .08s steps(2, end);
    }

    .comic-card:hover,
    .comic-card:focus-visible {
      transform: translate(-1px, -1px);
      outline: 2px dotted #111;
      outline-offset: 2px;
      box-shadow:
        inset 2px 2px 0 var(--bevel-light),
        inset -2px -2px 0 var(--bevel-dark),
        3px 3px 0 #3e4554;
    }

    .comic-art {
      background:
        repeating-linear-gradient(135deg, #111 0 1px, transparent 1px 7px),
        #000;
      aspect-ratio: 3 / 4;
      border-bottom: 1px solid #313644;
    }

    .comic-meta {
      padding: 3px 4px 5px;
      background: #8d94a5;
      border-top: 1px solid #535b6d;
      line-height: .86;
    }

    .comic-title {
      display: block;
      font-size: 16px;
    }

    .comic-author {
      display: block;
      font-size: 12px;
      font-weight: 700;
    }

    .comic-stats {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 10px;
      white-space: nowrap;
      font-family: "Trebuchet MS", Verdana, Arial, sans-serif;
    }

    @media (max-width: 520px) {
      .page {
        width: 100%;
        border: 0;
        padding: 0 12px 24px;
      }

      .topbar {
        flex-wrap: wrap;
        min-height: auto;
        padding-bottom: 7px;
      }

      .brand {
        width: min(260px, 100%);
      }

      .nav {
        width: 100%;
        padding-top: 0;
      }

      .comics-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .shelf h2 {
        font-size: 16px;
      }

      .comic-title {
        font-size: 15px;
      }

      .comic-author {
        font-size: 11px;
      }

      .comic-stats {
        font-size: 10px;
      }

      .empty-state {
        font-size: 13px;
        padding: 14px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar" aria-label="Site header">
      <img class="brand" src="Logo.png" alt="Sketchbook Trilogies">
      <div class="topbar-menu">
        <nav class="nav" aria-label="Primary navigation">
          <p><span>|</span></p>
          <p><a href="index.html">home</a></p>
          <p><span>-</span></p>
          <p><a href="blog.html">blog</a></p>
          <p><span>-</span></p>
          <p><a href="settings.html">settings</a></p>
        </nav>

      </div>
    </header>

    <h1>Library</h1>
    <p class="subtitle">Comics you've saved, hearted, and recently read.</p>

    <section class="state-box" id="state-box" hidden></section>

    <section id="library-content" hidden>
      <div class="shelf">
        <h2>Recently read</h2>
        <div class="comics-grid" id="recent-grid"></div>
      </div>

      <div class="shelf">
        <h2>Saved</h2>
        <div class="comics-grid" id="saved-grid"></div>
      </div>

      <div class="shelf">
        <h2>Hearted</h2>
        <div class="comics-grid" id="hearted-grid"></div>
      </div>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
    import { getAnalytics, isSupported } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-analytics.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
    import {
      getFirestore, doc, getDoc, getDocs, collection, collectionGroup, query, where, orderBy, limit,
    } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore-lite.js";

    // If this page is restored from the browser's back/forward cache (e.g.
    // after signing in/out as a different account on another page, then
    // hitting Back), force a fresh reload so auth-dependent UI (like
    // "edit profile" or "account settings") re-evaluates against whoever is
    // ACTUALLY signed in right now, instead of showing stale cached state.
    window.addEventListener("pageshow", (event) => {
      if (event.persisted) {
        window.location.reload();
      }
    });

    const firebaseConfig = {
      apiKey: "AIzaSyDg6umXxHQ6INyc_U2AvmhF9blhQ5ZEtT8",
      authDomain: "sketchbook-trilogies.firebaseapp.com",
      projectId: "sketchbook-trilogies",
      storageBucket: "sketchbook-trilogies.firebasestorage.app",
      messagingSenderId: "564902002463",
      appId: "1:564902002463:web:7dc95e5e857e19b959fa2a",
      measurementId: "G-Q08PSQDHMH",
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    if (await isSupported()) {
      getAnalytics(app);
    }

    const stateBox = document.querySelector("#state-box");
    const libraryContent = document.querySelector("#library-content");
    const recentGrid = document.querySelector("#recent-grid");
    const savedGrid = document.querySelector("#saved-grid");
    const heartedGrid = document.querySelector("#hearted-grid");

    function renderEmpty(container, message) {
      container.innerHTML = `<p class="empty-state">${message}</p>`;
    }

    function renderGrid(container, comics, emptyMessage) {
      container.innerHTML = "";
      if (!comics.length) {
        renderEmpty(container, emptyMessage);
        return;
      }
      comics.forEach((comic) => {
        const card = document.createElement("a");
        card.className = "comic-card";
        card.href = `webcomic-view.html?id=${encodeURIComponent(comic.id || "")}`;

        const art = document.createElement("div");
        art.className = "comic-art";
        art.setAttribute("aria-hidden", "true");
        if (comic.coverImage) {
          art.style.backgroundImage = `url("${comic.coverImage}")`;
          art.style.backgroundSize = "cover";
          art.style.backgroundPosition = "center";
        }

        const meta = document.createElement("div");
        meta.className = "comic-meta";
        const title = document.createElement("span");
        title.className = "comic-title";
        title.textContent = comic.title || "Untitled";
        const author = document.createElement("span");
        author.className = "comic-author";
        author.textContent = `by ${comic.authorName || "someone"}`;
        meta.append(title, author);

        card.append(art, meta);
        container.append(card);
      });
    }

    // Fetches the webcomic doc for each id, drops any that no longer exist
    // (deleted) or aren't readable anymore (e.g. unpublished by their
    // author since you hearted/saved/read it), and keeps the given order.
    async function hydrateComics(comicIds) {
      const results = await Promise.all(comicIds.map(async (id) => {
        try {
          const snap = await getDoc(doc(db, "webcomics", id));
          if (!snap.exists()) return null;
          const data = snap.data();
          if (data.status !== "published") return null;
          return { id: snap.id, ...data };
        } catch (error) {
          return null;
        }
      }));
      return results.filter(Boolean);
    }

    async function loadRecentlyRead(uid) {
      const progressQuery = query(
        collection(db, "users", uid, "readingProgress"),
        orderBy("updatedAt", "desc"),
        limit(12),
      );
      const snapshot = await getDocs(progressQuery);
      return hydrateComics(snapshot.docs.map((d) => d.id));
    }

    // Saves/hearts live as subcollections on each webcomic
    // (webcomics/{comicId}/saves/{uid}), not under the user, so listing
    // "mine across every webcomic" needs a collection-group query filtered
    // by the uid field stored on each doc (see firestore.rules).
    async function loadByCollectionGroup(groupName, uid) {
      const groupQuery = query(collectionGroup(db, groupName), where("uid", "==", uid));
      const snapshot = await getDocs(groupQuery);
      const comicIds = snapshot.docs
        .map((d) => d.ref.parent.parent?.id)
        .filter(Boolean);
      return hydrateComics(comicIds);
    }

    async function loadLibrary(uid) {
      const [recent, saved, hearted] = await Promise.all([
        loadRecentlyRead(uid).catch((error) => { console.error("Could not load recently read:", error); return []; }),
        loadByCollectionGroup("saves", uid).catch((error) => { console.error("Could not load saved comics:", error); return []; }),
        loadByCollectionGroup("hearts", uid).catch((error) => { console.error("Could not load hearted comics:", error); return []; }),
      ]);

      renderGrid(recentGrid, recent, "Nothing read yet. Open a webcomic to start your reading history.");
      renderGrid(savedGrid, saved, "Nothing saved yet. Use the save button on a webcomic's page.");
      renderGrid(heartedGrid, hearted, "Nothing hearted yet. Use the heart button on a webcomic's page.");
    }

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        stateBox.hidden = false;
        stateBox.innerHTML = 'Sign in to view your library. <a href="auth-sign-in.html?mode=signin">Sign in</a>';
        libraryContent.hidden = true;
        return;
      }

      stateBox.hidden = true;
      libraryContent.hidden = false;
      loadLibrary(user.uid).catch((error) => {
        console.error("Could not load library:", error);
      });
    });
  </script>
</body>
</html>
