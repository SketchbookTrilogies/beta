<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Uh oh!</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <style>
    :root {
      --ink: #05070b;
      --paper: #bfc7dc;
      --panel: #8a91a1;
      --line: #090a0d;
      --link: #002fff;
      --visited: #4f1eb7;
      --bevel-light: #c8cedd;
      --bevel-dark: #4c5363;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 1px 1px, #2a2a33 1px, transparent 1.5px) 0 0 / 7px 7px,
        #06060a;
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
    }

    a {
      color: var(--link);
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 1px;
    }

    a:visited {
      color: var(--visited);
    }

    .page {
      width: min(100vw - 18px, 720px);
      min-height: 100vh;
      margin: 0 auto;
      background:
        repeating-linear-gradient(0deg, rgba(255, 255, 255, .06) 0 1px, transparent 1px 4px),
        var(--paper);
      border-left: 4px solid #51596b;
      border-right: 4px solid #51596b;
      box-shadow: 0 0 0 1px #171a22;
      padding: 0 22px 32px;
    }

    .topbar {
      min-height: 42px;
      display: flex;
      align-items: start;
      gap: 6px;
      border-bottom: 3px double #6c758b;
      overflow: hidden;
    }

    .brand {
      width: 215px;
      height: 34px;
      object-fit: contain;
      object-position: left center;
      filter: contrast(1.18);
      margin-top: 2px;
    }

    .nav {
      display: flex;
      align-items: start;
      gap: 4px;
      min-height: 34px;
      padding-top: 3px;
      font-size: 16px;
      line-height: 1.15;
      white-space: nowrap;
      flex-wrap: wrap;
    }

    .nav p,
    p {
      margin: 0;
    }

    h1 {
      margin: 14px 0 0;
      font-size: 26px;
      line-height: 1.05;
      text-transform: uppercase;
      text-shadow: 1px 1px 0 #e2e6f2;
    }

    .subtitle {
      margin-top: 4px;
      padding-bottom: 12px;
      font-size: 14px;
      font-weight: 700;
      border-bottom: 4px solid var(--line);
    }

    .state-box {
      margin-top: 14px;
      border: 4px solid #5f687d;
      background: #a2aabc;
      color: #1d2330;
      padding: 14px;
      font-size: 14px;
      line-height: 1.3;
    }

    .panel {
      margin-top: 14px;
      border: 4px solid #5f687d;
      background: var(--panel);
      box-shadow:
        inset 2px 2px 0 var(--bevel-light),
        inset -2px -2px 0 var(--bevel-dark);
      padding: 22px 14px;
      text-align: center;
      font-size: 14px;
      color: #23283a;
    }

    .panel[hidden] {
      display: none;
    }

    .panel b {
      display: block;
      font-size: 17px;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    @media (max-width: 520px) {
      .page {
        width: 100%;
        border: 0;
        padding: 0 12px 24px;
      }

      .topbar {
        flex-wrap: wrap;
        min-height: auto;
        padding-bottom: 7px;
      }

      .brand {
        width: min(260px, 100%);
      }

      .nav {
        width: 100%;
        padding-top: 0;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar" aria-label="Site header">
      <img class="brand" src="Logo.png" alt="Sketchbook Trilogies">
      <div class="topbar-menu">
        <nav class="nav" aria-label="Primary navigation">
          <p><span>|</span></p>
          <p><a href="index.html">home</a></p>
        </nav>

      </div>
    </header>

    <h1>404</h1>
    <p class="subtitle">Page not found</p>

    <section class="state-box" id="state-box" hidden></section>

    <section class="panel" id="dms-panel" hidden>
      <b>Page not found</b>
      This link is invalid.
    </section>
  </main>
</body>
</html>
